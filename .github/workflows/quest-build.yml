name: Build Nuvio Quest APK

on:
  push:
    branches:
      - quest-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_USE_DEBUG_SIGNING: "true"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Nuvio backend configuration
        shell: bash
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            cat > local.dev.properties <<'EOF'
NUVIO_SUPABASE_URL=https://api.nuvio.tv
NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
NUVIO_SUPABASE_FALLBACK_URL=https://api-two.nuvioapp.space
TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
DEVICE_LOGIN_WEB_BASE_URL=https://nuvio.tv/link
AVATAR_PUBLIC_BASE_URL=https://api.nuvio.tv/storage/v1/object/public/avatars
EOF
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Quest test APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Collect ARM64 APK
        shell: bash
        run: |
          mkdir -p quest-apk
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          cp "$APK" quest-apk/NuvioQuest-v0.2-debug.apk

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioQuest-v0.2
          path: quest-apk/NuvioQuest-v0.2-debug.apk
          if-no-files-found: error
