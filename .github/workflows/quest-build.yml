name: Build Nuvio Quest APK

on:
  push:
    branches:
      - quest-support
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvio-quest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_USE_DEBUG_SIGNING: "true"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Nuvio backend configuration
        shell: bash
        run: |
          if [ -z "$LOCAL_PROPERTIES_BASE64" ]; then
            echo "::error::Missing LOCAL_DEV_PROPERTIES_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          rm -f local.dev.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Quest test APK
        run: ./gradlew :app:assembleFullRelease --stacktrace

      - name: Collect ARM64 APK
        shell: bash
        run: |
          mkdir -p quest-apk
          APK="$(find app/build/outputs/apk/full/release -type f -name '*arm64-v8a*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          cp "$APK" quest-apk/NuvioQuest-v0.4.1.1-release.apk

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioQuest-v0.4.1
          path: quest-apk/NuvioQuest-v0.4.1.1-release.apk
          if-no-files-found: error
