name: Build Nuvio Quest APK

on:
  push:
    branches:
      - quest-support
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_USE_DEBUG_SIGNING: "true"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Quest test APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Collect ARM64 APK
        shell: bash
        run: |
          mkdir -p quest-apk
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*arm64-v8a*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          cp "$APK" quest-apk/NuvioQuest-v0.1-debug.apk

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioQuest-v0.1
          path: quest-apk/NuvioQuest-v0.1-debug.apk
          if-no-files-found: error
